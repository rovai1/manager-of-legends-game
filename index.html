oney(t.loanWage)}/week</b> (60% of wages). They return to ${esc(t.from.name)} after the season.</p>`,"Loan player",(()=>loanIn(a.id)))},loanOut:e=>{const a=P(+e.id);askConfirm(`<h2>Loan out ${esc(a.handle)}?</h2><p>A team at your level or lower takes them for the season and pays their wages. You get a small fee (${fmtMoney(roundTo(.05*valueOf(a),100))}).</p>`,"Loan out",(()=>loanOut(a.id)))},list:e=>toggleList(+e.id),quickSell:e=>{const a=P(+e.id),t=sellBlock(a);if(t)return toast(t,"warn");askConfirm(`<h2>Sell ${esc(a.handle)} now?</h2><p>An interested team pays <b>${fmtMoney(quickSellPrice(a))}</b>${a.contract.until<=G.season?" (their contract ends this season, so the price is halved)":""}. Listing them instead gets bids closer to full value.</p>`,"Sell now",(()=>quickSell(a.id)),!0)},release:e=>{const a=P(+e.id);askConfirm(`<h2>Release ${esc(a.handle)}?</h2><p>Terminating the contract costs <b>${fmtMoney(releaseCost(a))}</b> (half of the remaining wages).</p>`,"Release",(()=>releasePlayer(a.id)),!0)},renew:e=>openNego(+e.id),promise:e=>{const a=P(+e.id),t=promiseBlock(a);if(t)return toast(t,"warn");const n=Math.max(1,Math.ceil(matchesLeft()/3)),s=getLineup(clubTeam()),o=null!=s[a.role]?P(s[a.role]):null;askConfirm(`<h2>Promise ${esc(a.handle)} playtime?</h2><p>You promise them at least <b>${n} of the ${matchesLeft()} matches</b> left this season (a third). Put them in the lineup yourself.</p>\n      <ul><li><b>${esc(a.handle)}</b>: +10 morale and +form now, +8 more when the promise is kept, <span class="bad">−20</span> if it can no longer be kept.</li>\n      ${o?`<li><b>${esc(o.handle)}</b> (current starter): +4 morale and +form from the competition.</li>`:""}\n      <li>Next season, whoever starts the first match in ${a.role} gets +8 morale; the other gets <span class="bad">−20</span>.</li></ul>`,"Promise",(()=>promiseStart(a.id)))},timeoff:e=>giveTimeOff(+e.id),role:e=>{const a=P(+e.id);askConfirm(`<h2>Change ${esc(a.handle)}'s role</h2><p class="small muted">Skills stay the same; each role weighs them differently. Their <b>role mastery</b> (shown below the rating) decides how much they lose at first; it grows every game. They lose a little morale.</p>\n      <div class="role-rates">${ROLES.map((e=>`<button class="${e===a.role?"on":""}" data-act="roleTo" data-id="${a.id}" data-v="${e}" ${e===a.role?"disabled":""}><small>${ROLE_ICON[e]} ${e}</small><b>${Math.round(ratingAs(a,e)-rolePenalty(a,e))}</b><small>mastery ${Math.round(roleMastery(a,e))}</small></button>`)).join("")}</div>`,"Close",null)},roleTo:e=>{UI.modal=null,changeRole(+e.id,e.v)},cancelCamp:()=>cancelCamp(),findCampaign:()=>lookForCampaigns(),convince:e=>askConfirm(`<h2>Pitch a ${STRATEGIES[e.v].name} policy?</h2><p>${STRATEGIES[e.v].desc}</p><p class="small muted">Chance ≈ ${Math.round(100*clamp(G.club.confidence/110,.1,.85))}%. If it fails: −5 confidence. Once per season.</p>`,"Pitch it",(()=>convinceBoard(e.v))),draftMode:e=>setClubDraft(e.v),buildHouse:()=>{const e=clubTeam();askConfirm(`<h2>Build a gaming house?</h2><p>Costs ${fmtMoney(HOUSE_COST[e.tier-1])}, then ${fmtMoney(Math.round(HOUSE_COST[e.tier-1]/150))}/week upkeep. Players ask ~12% lower wages and get +6 morale now.</p>`,"Build it",buildHouse)},takeJob:e=>{const a=G.club.fired.jobs[+e.i],t=T(a.tid);askConfirm(`<h2>Take the job at ${esc(t.name)}?</h2><p>Budget ${fmtMoney(a.budget)}, your wage ${fmtMoney(mgrWage(t.tier))}/week.</p>`,"Sign",(()=>takeJob(a)))},retireMgr:()=>askConfirm("<h2>Retire for good?</h2><p>Your career goes to the Hall of Legends and this save is deleted.</p>","Retire",retireMgr,!0),resign:()=>askConfirm("<h2>Resign?</h2><p>You leave the club (−2 manager rep) and can take a job elsewhere."+(G.club.owner?" As owner you sell your stake for half of the club’s value.":"")+"</p>","Resign",resignClub,!0)};</script>
